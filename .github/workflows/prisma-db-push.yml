name: Deploy Database Schema

on:
  push:
    branches:
      - master # Команда будет запускаться при пуше в ветку main
  workflow_dispatch: # Позволяет запускать процесс вручную кнопкой

jobs:
  db-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # у себя в проекте использую 20-ю версию
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Sync and Generate
        run: |
          npx prisma db push --accept-data-loss
          npx prisma generate
        env:
          DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}

      - name: Seed Database
        run: npx tsx prisma/seed.ts
        env:
          DATABASE_URL: ${{ secrets.POSTGRES_URL_NON_POOLING }}
